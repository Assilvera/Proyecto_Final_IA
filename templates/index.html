<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recovery AI Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="app welcome-mode" id="app">
        <header class="header" id="header">
            <div class="logo" aria-hidden="true">
                <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="48" height="48" rx="14" fill="url(#logoGrad)"/>
                    <path d="M24 10C17.37 10 12 15.37 12 22c0 4.2 2.1 7.9 5.3 10.1L15 38h18l-2.3-5.9C33.9 29.9 36 26.2 36 22c0-6.63-5.37-12-12-12z" fill="white" fill-opacity="0.95"/>
                    <circle cx="19" cy="21" r="2" fill="#0a1628"/>
                    <circle cx="29" cy="21" r="2" fill="#0a1628"/>
                    <path d="M19 27c1.5 2 4.5 2 6 0" stroke="#0a1628" stroke-width="1.5" stroke-linecap="round"/>
                    <defs>
                        <linearGradient id="logoGrad" x1="0" y1="0" x2="48" y2="48">
                            <stop stop-color="#2563eb"/>
                            <stop offset="1" stop-color="#1d4ed8"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            <h1 class="title">Recovery AI Assistant</h1>
            <p class="subtitle">Asistente Inteligente de Recuperación de Cartera</p>
        </header>

        <main class="chat-container" id="chatContainer">
            <div class="messages" id="messages" role="log" aria-live="polite"></div>
        </main>

        <footer class="input-area" id="inputArea">
            <form class="query-bar" id="queryForm" autocomplete="off">
                <input
                    type="text"
                    id="cedulaInput"
                    name="cedula"
                    placeholder="Consulta una cédula de cliente..."
                    inputmode="numeric"
                    pattern="[0-9]*"
                    required
                    aria-label="Cédula del cliente"
                >
                <button type="submit" id="submitBtn">
                    <span class="btn-text">Analizar</span>
                    <span class="btn-spinner" aria-hidden="true"></span>
                </button>
            </form>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
